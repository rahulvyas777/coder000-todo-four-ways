<div class="app">
  <aside class="sidebar">
    <div class="sidebar-head">
      <h1 class="app-title" data-testid="app-title">Tasks</h1>
    </div>
    <nav aria-label="Lists">
      <ul class="list-nav" data-testid="list-nav">
        @for (list of store.lists(); track list.id) {
          <li
            class="list-item"
            [attr.data-testid]="'list-item-' + list.id"
            routerLinkActive="active"
            #rla="routerLinkActive"
          >
            <a [routerLink]="['/lists', list.id]" [attr.aria-current]="rla.isActive ? 'page' : null">
              <span>{{ list.name }}</span>
              <span class="list-count" [attr.data-testid]="'list-count-' + list.id">{{ list.openCount }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>
  </aside>
  <router-outlet />
</div>
