<header class="main-head">
  <h2>{{ list()?.name ?? '' }}</h2>
  <span class="task-count" data-testid="task-count" aria-live="polite">
    @if (tasksResource.hasValue()) {
      {{ format(openCount()) }} of {{ format(tasks().length) }} open
    }
  </span>
</header>
<div class="task-add">
  <input
    #addInput
    type="text"
    data-testid="task-add-input"
    aria-label="Add a task"
    placeholder="Add a task"
    maxlength="200"
    (keydown.enter)="addTask(addInput)"
  />
</div>
<div class="rows-container" data-testid="rows-container" role="list" aria-label="Tasks">
  @for (task of tasks(); track task.id) {
    <div
      class="task-row"
      role="listitem"
      [class.completed]="task.completed"
      [attr.data-testid]="'task-row-' + task.id"
    >
      <input
        #check
        type="checkbox"
        class="task-check"
        [attr.data-testid]="'task-check-' + task.id"
        [checked]="task.completed"
        [attr.aria-label]="'Completed: ' + task.title"
        (change)="toggle(task, check)"
      />
      @if (editingId() === task.id) {
        <span class="task-title">
          <input
            type="text"
            appAutofocus
            maxlength="200"
            [attr.aria-label]="'Edit title of ' + task.title"
            [value]="task.title"
            (keydown.enter)="commitEdit(task, $any($event.target).value)"
            (keydown.escape)="cancelEdit()"
            (blur)="commitEdit(task, $any($event.target).value)"
          />
        </span>
      } @else {
        <span class="task-title" [attr.data-testid]="'task-title-' + task.id" (dblclick)="startEdit(task.id)">{{
          task.title
        }}</span>
      }
      <button
        type="button"
        class="btn-icon btn-danger task-delete"
        [attr.data-testid]="'task-delete-' + task.id"
        [attr.aria-label]="'Delete task ' + task.title"
        title="Delete"
        (click)="deleteTask(task)"
      >
        <svg class="icon" aria-hidden="true"><use href="icons.svg#i-trash" /></svg>
      </button>
    </div>
  }
</div>
