<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasks</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <script>
        // Set the theme before first paint: the stored choice wins, else the system preference.
        (function () {
            var t = null;
            try { t = localStorage.getItem('tasks-theme'); } catch (e) { }
            if (t !== 'light' && t !== 'dark')
                t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="css/blazor.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="BlazorWasmClient.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <p class="empty-state">Loading…</p>
    </div>

    <div id="blazor-error-ui" role="alert">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <button type="button" class="dismiss" aria-label="Dismiss">×</button>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
